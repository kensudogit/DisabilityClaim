# DisabilityClaim local stack (placeholder)
# Backend image/build context is expected under ./backend when implemented.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: disability_claim
      POSTGRES_USER: dc
      POSTGRES_PASSWORD: dc
    ports:
      - "5432:5432"
    volumes:
      - dc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dc -d disability_claim"]
      interval: 5s
      timeout: 5s
      retries: 10

  # backend:
  #   build: ./backend
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/disability_claim
  #     SPRING_DATASOURCE_USERNAME: dc
  #     SPRING_DATASOURCE_PASSWORD: dc
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     db:
  #       condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://host.docker.internal:8080
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  dc_pgdata:
