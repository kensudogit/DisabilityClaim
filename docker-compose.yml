services:
  db:
    image: postgres:16-alpine
    container_name: disability-claim-db
    environment:
      POSTGRES_DB: disability_claim
      POSTGRES_USER: disability
      POSTGRES_PASSWORD: disability
    ports:
      - "5433:5432"
    volumes:
      - dc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disability -d disability_claim"]
      interval: 5s
      timeout: 5s
      retries: 10

  # backend:
  #   build: ./backend
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/disability_claim
  #     SPRING_DATASOURCE_USERNAME: disability
  #     SPRING_DATASOURCE_PASSWORD: disability
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     db:
  #       condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://host.docker.internal:8080
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - full

volumes:
  dc_pgdata:
