spring:
  application:
    name: disability-claim-backend
  datasource:
    # Railway: DATABASE_URL (jdbc:...) または SPRING_DATASOURCE_URL を推奨
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5433/disability_claim}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${DB_USER:disability}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${DB_PASSWORD:disability}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Tokyo
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    # DB 未接続でも liveness 用 ping は UP にできる（Railway 内部確認用）
    defaults:
      enabled: true

app:
  security:
    jwt-secret: ${JWT_SECRET:disability-claim-dev-secret-change-me-32bytes-min}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  import:
    allow-partial-default: false

logging:
  level:
    com.disabilityclaim: INFO
