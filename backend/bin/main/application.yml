spring:
  application:
    name: disability-claim-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5433/disability_claim}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:disability}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:disability}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Tokyo
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  security:
    jwt-secret: ${JWT_SECRET:disability-claim-dev-secret-change-me-32bytes-min}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  import:
    allow-partial-default: false

logging:
  level:
    com.disabilityclaim: INFO
